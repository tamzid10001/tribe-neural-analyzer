<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRIBE v2 Neural Analyzer — Predict Cortical Response & Virality</title>
  <meta name="description" content="Upload any video, image, audio, or text to predict how the human cortex responds using Meta's TRIBE v2 atlas and score virality via the Knutson AIM framework." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>

  <!-- App Main State-driven Wrapper -->
  <div id="app-container" class="state-landing">

    <!-- Floating Top Bar (Invisible/minimalist, server status) -->
    <div class="top-bar">
      <div class="server-status-container" id="server-status">
        <span class="status-dot offline" id="server-status-dot"></span>
        <span class="status-text" id="server-status-text">Engine Offline</span>
      </div>
    </div>

    <!-- Main Viewport containing dynamic states -->
    <div class="main-viewport">

      <!-- Conversational Chat Messages Scroller -->
      <div class="chat-scroller" id="chat-scroller">
        <div class="chat-messages-thread" id="chat-messages">
          <!-- Dynamic conversation appended here -->
        </div>
      </div>

    </div>

    <!-- Neural Scan Composer -->
    <footer class="composer-container" id="composer-container">
      <div class="composer-inner">

        <div class="scan-composer" id="scan-composer">
          <div class="modality-tabs" role="tablist" aria-label="Stimulus type">
            <button type="button" class="modality-tab active" id="tab-video" data-mode="video" role="tab" aria-selected="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
              Video
            </button>
            <button type="button" class="modality-tab" id="tab-audio" data-mode="audio" role="tab" aria-selected="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
              Audio
            </button>
            <button type="button" class="modality-tab" id="tab-image" data-mode="image" role="tab" aria-selected="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
              Image
            </button>
            <button type="button" class="modality-tab" id="tab-script" data-mode="text" role="tab" aria-selected="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
              Script
            </button>
          </div>

          <div class="stimulus-panel">
            <div class="stimulus-dropzone" id="stimulus-dropzone">
              <input type="file" id="file-uploader" accept="video/*" hidden />
              <button type="button" class="dropzone-hit" id="btn-dropzone-browse">
                <span class="dropzone-title" id="dropzone-title">Drop video stimulus here</span>
                <span class="dropzone-hint" id="dropzone-hint">MP4, MOV, WebM · maps V1, FFA, EBA, STS, NAcc onset</span>
                <span class="dropzone-cta">Browse files</span>
              </button>
            </div>

            <div class="stimulus-script-row hidden" id="stimulus-script-row">
              <textarea id="chat-textarea" rows="2" aria-label="Text input"></textarea>
            </div>

            <div class="attachment-preview-row hidden" id="attachment-preview-row"></div>
          </div>

          <div class="scan-action-bar">
            <div class="scan-action-left">
              <div class="engine-dropdown-container">
                <button class="btn-engine-select" id="btn-engine-select" title="Inference engine" type="button">
                  <span id="engine-display-label">TRIBE v2</span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="10" height="12"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
                <div class="engine-dropdown-menu hidden" id="engine-dropdown-menu">
                  <div class="engine-option active" id="option-cloud-run" data-mode="cloud">
                    <span class="option-check" aria-hidden="true"></span>
                    <div class="option-meta">
                      <span class="option-title">TRIBE v2 Cloud</span>
                      <span class="option-subtitle">Meta foundation model · full fMRI vertex prediction</span>
                    </div>
                  </div>
                  <div class="engine-option" id="option-browser-sim" data-mode="sim">
                    <span class="option-check"></span>
                    <div class="option-meta">
                      <span class="option-title">Browser Simulation</span>
                      <span class="option-subtitle">Client-side feature extraction · offline preview</span>
                    </div>
                  </div>
                </div>
              </div>
              <button class="btn-mic" id="btn-mic" title="Dictate script" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17">
                  <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                  <path d="M19 10v1a7 7 0 0 1-14 0v-1"></path>
                  <line x1="12" y1="19" x2="12" y2="23"></line>
                  <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>
              </button>
            </div>
            <button class="btn-scan disabled" id="btn-chat-send" title="Run neural scan" type="button" disabled>
              <span>Run Neural Scan</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="16" height="16">
                <path d="M5 12h14M13 6l6 6-6 6"/>
              </svg>
            </button>
          </div>
        </div>

      </div>
    </footer>

    <!-- Slide-out Settings Drawer (Right-aligned, glassmorphic settings overrides) -->
    <div class="settings-drawer" id="settings-drawer">
      <div class="drawer-header">
        <h3>Engine Override</h3>
        <button class="btn-drawer-close" id="btn-drawer-close" type="button" aria-label="Close">Close</button>
      </div>
      <div class="drawer-content">
        <p class="drawer-description">Backend URL for TRIBE v2 Cloud Run. OIDC token is only needed if the service is not public.</p>
        <div class="settings-group">
          <label for="backend-url-input">Backend Service URL</label>
          <input type="text" id="backend-url-input" placeholder="https://tribe-backend-351432107547.us-central1.run.app" />
        </div>
        <div class="settings-group">
          <label for="backend-token-input">OIDC ID Token</label>
          <textarea id="backend-token-input" rows="7" placeholder="eyJhbGciOiJSUzI1NiIsImtpZCI6..."></textarea>
        </div>
        <button class="btn-save-settings" id="btn-save-backend-url">Save Overrides</button>
      </div>
    </div>

  </div>

  <!-- Hidden HTML5 Media decoders & canvases for feature extraction -->
  <video id="hidden-video" crossorigin="anonymous" style="display:none"></video>
  <canvas id="hidden-canvas" style="display:none"></canvas>
  <audio id="hidden-audio" crossorigin="anonymous" style="display:none"></audio>

  <!-- Application core JS -->
  <script src="app.js?v=3"></script>
</body>
</html>
